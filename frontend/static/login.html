<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Enterprise Hybrid Agentic SOC Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/soc-theme.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            padding: 36px 32px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .input-field {
            width: 100%;
            padding: 12px 14px;
            background: #090d16;
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-card glass-panel">
        <div style="text-align:center; margin-bottom:28px;">
            <div style="width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg, #38bdf8, #a855f7); display:inline-flex; align-items:center; justify-content:center; font-size:1.8rem; margin-bottom:14px;">
                🛡️
            </div>
            <h1 style="font-size:1.35rem; font-weight:700; color:#f8fafc; letter-spacing:-0.02em;">
                HYBRID AGENTIC SOC
            </h1>
            <p style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">
                Acesso Restrito — Central de Operações de Segurança
            </p>
        </div>

        <div id="error-alert" style="display:none; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#ef4444; padding:10px 14px; border-radius:8px; font-size:0.82rem; margin-bottom:18px;">
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Usuário / Operador SOC</label>
                <input type="text" id="username" class="input-field" placeholder="admin" required autocomplete="username">
            </div>

            <div class="input-group">
                <label>Senha de Acesso</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btn-submit" class="btn-cyber" style="width:100%; justify-content:center; padding:12px; font-size:0.95rem; margin-top:10px; background:rgba(56,189,248,0.2);">
                🔒 Entrar no Command Center
            </button>
        </form>

        <div style="margin-top:24px; padding-top:18px; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; color:var(--text-muted);">
            <span>Padrão Inicial: <code>admin / admin123</code></span>
            <button type="button" onclick="fillDemo()" style="background:transparent; border:none; color:#38bdf8; cursor:pointer; text-decoration:underline;">Preencher</button>
        </div>
    </div>

    <script>
        function fillDemo() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errDiv = document.getElementById('error-alert');
            errDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerText = 'Autenticando...';

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (res.ok && data.access_token) {
                    localStorage.setItem('soc_token', data.access_token);
                    localStorage.setItem('soc_user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    errDiv.innerText = data.detail || 'Usuário ou senha inválidos.';
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.innerText = 'Erro ao conectar ao servidor.';
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = '🔒 Entrar no Command Center';
            }
        }
    </script>
</body>
</html>
